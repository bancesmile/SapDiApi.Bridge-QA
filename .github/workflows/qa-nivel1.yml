name: QA Nivel 1 - Calidad y Compilacion

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:

  # ==========================================================
  # NIVEL 1 - CALIDAD Y COMPILACION
  # ==========================================================
  nivel-1:
    name: Nivel 1 - Calidad y Compilacion
    runs-on: self-hosted

    # Aplicar la politica al iniciar cada proceso de PowerShell
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -Command ". '{0}'"

    steps:

      # 1. Descargar el commit que disparo esta ejecucion
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # 2. Validar estructura minima
      - name: Validar estructura del proyecto
        run: |
          if (-not (Test-Path "./BridgeSap.slnx")) {
              Write-Error "No se encontro BridgeSap.slnx"
              exit 1
          }

          if (-not (Test-Path "./SapDiApi.Bridge/SapDiApi.Bridge.csproj")) {
              Write-Error "No se encontro SapDiApi.Bridge.csproj"
              exit 1
          }

          if (-not (Test-Path "./SapDiApi.Bridge.Tests/SapDiApi.Bridge.Tests.csproj")) {
              Write-Error "No se encontro SapDiApi.Bridge.Tests.csproj"
              exit 1
          }

          Write-Host "Estructura del proyecto correcta."

      # 3. Restaurar paquetes NuGet
      - name: Restaurar dependencias
        run: dotnet restore ./BridgeSap.slnx

      # 4. Validar formato
      - name: Validar formato del codigo
        run: dotnet format whitespace ./BridgeSap.slnx --verify-no-changes --no-restore

      # 5. Compilar solucion
      - name: Compilar solucion
        run: dotnet build ./BridgeSap.slnx --configuration Release --no-restore --no-incremental
  # ==========================================================
  # ACTUALIZAR MAIN SOLO SI NIVEL 1 APRUEBA
  # ==========================================================
  actualizar-main:
    name: Actualizar Main
    needs: nivel-1
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Descargar commit validado
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Promover commit validado a main
        env:
          QA_COMMIT: ${{ github.sha }}
        run: |
          git fetch origin
          git checkout main
          git merge --no-edit "$QA_COMMIT"
          git push origin main