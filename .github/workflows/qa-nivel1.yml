name: QA Nivel 1 - Calidad y Compilacion

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:

  # ==========================================================
  # NIVEL 1 - CALIDAD Y COMPILACION
  # ==========================================================
  nivel-1:
    name: Nivel 1 - Calidad y Compilacion
      runs-on: self-hosted

    steps:

      # 1. Descargar codigo
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Configurar .NET 8
      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Validar estructura minima
      - name: Validar estructura del proyecto
        shell: pwsh
        run: |
          if (-not (Test-Path "./BridgeSap.slnx")) {
              Write-Error "No se encontro BridgeSap.slnx"
              exit 1
          }

          if (-not (Test-Path "./SapDiApi.Bridge/SapDiApi.Bridge.csproj")) {
              Write-Error "No se encontro SapDiApi.Bridge.csproj"
              exit 1
          }

          if (-not (Test-Path "./SapDiApi.Bridge.Tests/SapDiApi.Bridge.Tests.csproj")) {
              Write-Error "No se encontro SapDiApi.Bridge.Tests.csproj"
              exit 1
          }

          Write-Host "Estructura del proyecto correcta."

      # 4. Restaurar paquetes NuGet
      - name: Restaurar dependencias
        run: dotnet restore ./BridgeSap.slnx

      # 5. Validar formato
      - name: Validar formato del codigo
        run: dotnet format ./BridgeSap.slnx --verify-no-changes --no-restore

      # 6. Compilar
      - name: Compilar solucion
        run: dotnet build ./BridgeSap.slnx --configuration Release --no-restore

      # 7. Validar warnings
      - name: Validar warnings
        run: dotnet build ./BridgeSap.slnx --configuration Release --no-restore -warnaserror


  # ==========================================================
  # ACTUALIZAR MAIN SOLO SI NIVEL 1 APRUEBA
  # ==========================================================
  actualizar-main:
    name: Actualizar Main
    needs: nivel-1
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Promover develop a main
        run: |
          git fetch origin
          git checkout main
          git merge origin/develop --no-edit
          git push origin main