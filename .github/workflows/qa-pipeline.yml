name: QA Pipeline - Niveles 1 y 2

run-name: ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:

  # ==========================================================
  # COMMIT QUE INICIO EL PIPELINE
  # ==========================================================
  commit:
    name: Commit - ${{ github.event.head_commit.message }}
    runs-on: ubuntu-latest

    steps:
      - name: Identificar commit
        run: |
          echo "Commit: ${{ github.sha }}"
          echo "Mensaje: ${{ github.event.head_commit.message }}"


  # ==========================================================
  # NIVEL 1 - CALIDAD Y COMPILACION
  # ==========================================================
  nivel-1:
    name: Nivel 1 - Calidad y Compilacion
    needs: commit
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -Command ". '{0}'"

    steps:

      # 1. Descargar exactamente el commit del push
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # 2. Validar estructura minima
      - name: Validar estructura del proyecto
        run: |
          if (-not (Test-Path "./BridgeSap.slnx")) {
              Write-Error "No se encontro BridgeSap.slnx"
              exit 1
          }

          if (-not (Test-Path "./SapDiApi.Bridge/SapDiApi.Bridge.csproj")) {
              Write-Error "No se encontro SapDiApi.Bridge.csproj"
              exit 1
          }

          if (-not (Test-Path "./SapDiApi.Bridge.Tests/SapDiApi.Bridge.Tests.csproj")) {
              Write-Error "No se encontro SapDiApi.Bridge.Tests.csproj"
              exit 1
          }

          Write-Host "Estructura del proyecto correcta."

      # 3. Restaurar paquetes NuGet
      - name: Restaurar dependencias
        run: dotnet restore ./BridgeSap.slnx

      # 4. Validar formato
      - name: Validar formato del codigo
        run: dotnet format whitespace ./BridgeSap.slnx --verify-no-changes --no-restore

      # 5. Compilar
      # Los warnings se muestran pero NO bloquean.
      - name: Compilar solucion
        run: dotnet build ./BridgeSap.slnx --configuration Release --no-restore --no-incremental


  # ==========================================================
  # NIVEL 2 - PRUEBAS UNITARIAS
  # ==========================================================
  nivel-2:
    name: Nivel 2 - Pruebas Unitarias
    needs: nivel-1
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -Command ". '{0}'"

    steps:

      # 1. Descargar el mismo commit aprobado por Nivel 1
      - name: Descargar commit validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # 2. Validar estructura Nivel 2
      - name: Validar estructura Nivel 2
        run: |
          if (-not (Test-Path "./SapDiApi.Bridge.Tests/SapDiApi.Bridge.Tests.csproj")) {
              Write-Error "No se encontro SapDiApi.Bridge.Tests.csproj"
              exit 1
          }

          if (-not (Test-Path "./SapDiApi.Bridge.Tests/Unit")) {
              Write-Error "No se encontro la carpeta Unit del Nivel 2"
              exit 1
          }

          Write-Host "Estructura del Nivel 2 correcta."

      # 3. Restaurar dependencias
      - name: Restaurar dependencias
        run: dotnet restore ./SapDiApi.Bridge.Tests/SapDiApi.Bridge.Tests.csproj

      # 4. Ejecutar las pruebas unitarias
      - name: Ejecutar pruebas unitarias
        run: |
          dotnet test ./SapDiApi.Bridge.Tests/SapDiApi.Bridge.Tests.csproj `
            --configuration Release `
            --no-restore `
            --filter "FullyQualifiedName~SapDiApi.Bridge.Tests.Unit" `
            --logger "console;verbosity=normal"

      # 5. Confirmacion
      - name: Nivel 2 aprobado
        run: |
          Write-Host "=========================================="
          Write-Host "QA NIVEL 2 APROBADO"
          Write-Host "Pruebas unitarias ejecutadas correctamente."
          Write-Host "=========================================="


  # ==========================================================
  # ACTUALIZAR MAIN SOLO SI NIVEL 1 Y NIVEL 2 APRUEBAN
  # ==========================================================
  actualizar-main:
    name: Actualizar Main
    needs: nivel-2
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Descargar commit aprobado
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Promover commit aprobado a main
        env:
          QA_COMMIT: ${{ github.sha }}
        run: |
          git fetch origin
          git checkout -B main origin/main
          git merge --ff-only "$QA_COMMIT"
          git push origin main