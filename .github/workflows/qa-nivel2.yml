name: QA Nivel 2 - Pruebas Unitarias

on:
  workflow_run:
    workflows:
      - "QA Nivel 1 - Calidad y Compilacion"
    types:
      - completed
    branches:
      - develop

permissions:
  contents: read

jobs:

  # ==========================================================
  # NIVEL 2 - PRUEBAS UNITARIAS
  # ==========================================================
  nivel-2:
    name: Nivel 2 - Pruebas Unitarias

    # Solo ejecutar si Nivel 1 termino correctamente
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: self-hosted

    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -Command ". '{0}'"

    steps:

      # 1. Descargar exactamente el commit aprobado por Nivel 1
      - name: Descargar commit validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # 2. Validar estructura de pruebas Nivel 2
      - name: Validar estructura Nivel 2
        run: |
          if (-not (Test-Path "./SapDiApi.Bridge.Tests/SapDiApi.Bridge.Tests.csproj")) {
              Write-Error "No se encontro SapDiApi.Bridge.Tests.csproj"
              exit 1
          }

          if (-not (Test-Path "./SapDiApi.Bridge.Tests/Unit")) {
              Write-Error "No se encontro la carpeta Unit del Nivel 2"
              exit 1
          }

          Write-Host "Estructura del Nivel 2 correcta."

      # 3. Restaurar dependencias
      - name: Restaurar dependencias
        run: |
          dotnet restore ./SapDiApi.Bridge.Tests/SapDiApi.Bridge.Tests.csproj

      # 4. Ejecutar pruebas unitarias Nivel 2
      - name: Ejecutar pruebas unitarias
        run: |
          dotnet test ./SapDiApi.Bridge.Tests/SapDiApi.Bridge.Tests.csproj `
            --configuration Release `
            --no-restore `
            --filter "FullyQualifiedName~SapDiApi.Bridge.Tests.Unit" `
            --logger "console;verbosity=normal"

      # 5. Confirmacion
      - name: Nivel 2 aprobado
        run: |
          Write-Host "=========================================="
          Write-Host "QA NIVEL 2 APROBADO"
          Write-Host "Pruebas unitarias ejecutadas correctamente."
          Write-Host "=========================================="